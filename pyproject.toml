[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "react-thought-ablation"
version = "0.1.0"
description = "Reproducible local CPU ALFWorld thought-history ablation"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "numpy>=1.24"]

[project.scripts]
react-ablation = "react_ablation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
